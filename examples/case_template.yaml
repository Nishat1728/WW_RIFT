# Copy this file, give the case a unique name, and edit only the products you need.
# Domain choices are: huc, shapefile, rectangle.  This runnable template uses a
# small rectangle; see README.md for HUC and local-vector examples.
case_name: example_domain
output_root: cases

domain:
  mode: rectangle
  bounds: [-72.31, 41.77, -72.23, 41.83]
  bounds_crs: EPSG:4326
  target_crs: auto_utm
  cell_size_m: 100
  download_buffer_cells: 2
  boundary_rule: cell_center
  outside_dem_mode: real_terrain

# Source resolution is independent of domain.cell_size_m.  This exact selected
# 30 m product is saved and plotted before it is mapped to the RIFT grid.
# Select either the 10 m or 30 m native 3DEP product.  cell_size_m above may
# be any positive RIFT-grid resolution; reprojection happens only afterward.
dem:
  enabled: true
  provider: watershed_workflow_3dep
  options:
    resolution_m: 30

# Initial depth is also an explicit selectable input. Choices are dry_zero,
# constant (add depth_m), or local (add a GeoTIFF path).
initial_state:
  enabled: true
  provider: dry_zero
  options: {}

hydrography:
  enabled: true
  provider: usgs_3dhp
  options: {}

river_bathymetry:
  apply_bathymetry: false
  depth_method: constant
  depth_m: 1.5
  width_method: constant
  width_m: 30
  cross_section: gaussian
  preserve_existing_lower_terrain: true
  enforce_downstream_monotonicity: false

land_cover:
  enabled: true
  provider: watershed_workflow_nlcd
  options:
    year: 2021
    location: L48
    variables: [cover, impervious, canopy]
    # Tiles overlap to avoid native-grid edge seams. Regional query bounds are
    # densified automatically before conversion to longitude/latitude.
    tile_degrees: 1.0
    tile_overlap_degrees: 0.02
    download_workers: 4
    max_attempts: 8
    # Default behavior is to stop and create a QC report/map if data are null
    # or have an unexpected dimension. Never set these values speculatively.
    # After reviewing quality_control/land_cover_coverage_map.png, a user may
    # explicitly provide constants for missing active cells:
    manual_fill_values: {}
    # Example after user review: {canopy: 0}
    # A constant may also replace a malformed source tile variable:
    manual_dimension_constants: {}
    # Example after user review: {cover: 41}
    # Alternatively set provider: local and provide all three corrected rasters:
    # rasters: {cover: path/to/cover.tif, impervious: path/to/impervious.tif,
    #           canopy: path/to/canopy.tif}

soil:
  enabled: true
  provider: watershed_workflow_ssurgo
  options:
    initial_saturation: 0.50
    # Conflicts where residual saturation exceeds porosity by strictly less
    # than this value are reported as warnings and left unchanged.
    residual_porosity_tolerance: 0.10
    root_depth_m: 0.50
    drainage_time_s: 172800
    # Missing active cells are never filled automatically. Review
    # quality_control/soil_coverage_map.png, then supply only user-approved values.
    manual_fill_values: {}

rainfall:
  enabled: true
  provider: watershed_workflow_aorc
  options:
    start_utc: '2023-06-10T00:00:00Z'
    end_utc: '2023-06-11T00:00:00Z'
    variables: [APCP_surface]
    # Keep native/event forcing unchanged. RIFT receives zero precipitation only
    # at active cells outside the downloaded product's spatial coverage.
    uncovered_policy: zero  # zero | error

# Explicit station definitions prevent hidden basin-specific gage choices or
# drainage-area multipliers.  Enable only after supplying your own stations.
inflows:
  enabled: false
  provider: usgs_waterdata
  options:
    start_utc: '2023-06-10T00:00:00Z'
    end_utc: '2023-06-11T00:00:00Z'
    stations: []

coastal:
  enabled: false
  provider: usgs_waterdata
  options:
    start_utc: '2023-06-10T00:00:00Z'
    end_utc: '2023-06-11T00:00:00Z'
    stations: []

drainage:
  enabled: false
  provider: synthetic_nlcd
  options:
    impervious_threshold_pct: 80

cache:
  # fresh: delete only a previously marked case directory and redownload.
  # reuse: retain the raw/provider_cache tree and reuse provider data.
  # The notebook exposes the same choice with its Cache mode dropdown.
  mode: fresh

plots:
  raw_products: true
  processed_products: true
  formats: [png]
  dpi: 180

simulation:
  start_time_s: 0
  # Omit end_time_s to match the enabled rainfall period automatically.
  # An explicit end_time_s is an advanced override, in elapsed simulation seconds.
  integration: rk2
  courant_limit: 0.25
  gpu_device: 0
  output_interval_s: 3600
  output_directory: results/native
