# Online-source default. Any NLCD-only reuse in validation is disclosed separately.
case_name: demo_huc12_010801040205
output_root: demo_cases
domain:
  mode: huc
  huc_code: '010801040205'
  target_crs: EPSG:5070
  cell_size_m: 30
  outside_dem_mode: wall
  wall_elevation_m: 9999
dem:
  provider: watershed_workflow_3dep
  options: {resolution_m: 30, tile_degrees: 0.5, max_attempts: 8}
initial_state: {provider: dry_zero}
hydrography: {provider: usgs_3dhp}
land_cover:
  provider: watershed_workflow_nlcd
  options: {year: 2021, location: L48, variables: [cover, impervious, canopy], manual_fill_values: {}}
soil:
  provider: watershed_workflow_ssurgo
  options:
    initial_saturation: 0.5
    residual_porosity_tolerance: 0.1
    # Explicit user-approved assumptions for missing processed cells only.
    manual_fill_values: {permeability: 1.0e-12, porosity: 0.42, residual: 0.08, alpha: 0.0002}
rainfall:
  provider: watershed_workflow_aorc
  options:
    start_utc: '2023-07-10T00:00:00Z'
    end_utc: '2023-07-12T00:00:00Z'
    variables: [APCP_surface]
    uncovered_policy: zero
inflows:
  provider: usgs_waterdata
  options:
    start_utc: '2023-07-10T00:00:00Z'
    end_utc: '2023-07-12T00:00:00Z'
    stations:
      - site: '01138500'
        id: connecticut_inlet
        support: {x: -72.1159051967093, y: 43.99433661265048, crs: EPSG:4326}
        support_width_m: 30
spinup:
  enabled: true
  start_utc: '2023-03-10T00:00:00Z'
  end_utc: '2023-07-10T00:00:00Z'
  provider: usgs_waterdata
  history_years: 20
  quantile: 0.0
  minimum_coverage: 0.9
  stations:
    - site: '01138500'
      id: connecticut_inlet
      support: {x: -72.1159051967093, y: 43.99433661265048, crs: EPSG:4326}
      support_width_m: 30
  output_interval_s: 86400
  output_directory: results/spinup
  save_hotstart: true
coastal: {enabled: false, provider: none}
drainage: {enabled: false, provider: none}
outlets:
  source: coordinates
  coordinates: [{x: -72.19999829322059, y: 43.78764142565809, width_m: 600}]
  crs: EPSG:4326
  method: open_corridor
  elevation_mode: terrain_matched
  default_width_m: 600
cache: {mode: fresh}
plots: {raw_products: true, processed_products: true, formats: [png], dpi: 110}
simulation:
  start_time_s: 0
  output_interval_s: 3600
  output_directory: results/transient
  save_hotstart: true
