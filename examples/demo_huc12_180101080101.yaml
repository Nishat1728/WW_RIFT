# Same selections as HUC12_Demo.ipynb. All sources are downloaded afresh.
# This demonstrates file preparation; it is not a calibrated flood simulation.
case_name: demo_huc12_180101080101
output_root: demo_cases
domain:
  mode: huc
  huc_code: '180101080101'
  target_crs: EPSG:5070
  cell_size_m: 30
  outside_dem_mode: wall
  wall_elevation_m: 9999
dem:
  provider: watershed_workflow_3dep
  options: {resolution_m: 30, tile_degrees: 0.5, max_attempts: 8}
initial_state:
  provider: dry_zero
hydrography:
  provider: usgs_3dhp
land_cover:
  provider: watershed_workflow_nlcd
  options:
    year: 2021
    location: L48
    variables: [cover, impervious, canopy]
    manual_fill_values: {}
soil:
  provider: watershed_workflow_ssurgo
  options:
    initial_saturation: 0.5
    residual_porosity_tolerance: 0.1
    manual_fill_values: {}
rainfall:
  provider: watershed_workflow_aorc
  options:
    start_utc: '2023-06-10T00:00:00Z'
    end_utc: '2023-06-12T00:00:00Z'
    variables: [APCP_surface]
    uncovered_policy: zero
inflows: {enabled: false, provider: none}
coastal: {enabled: false, provider: none}
drainage: {enabled: false, provider: none}
spinup: {enabled: false}  # No inlet gauge is assumed in the first-run demo.
outlets:
  source: auto_hydrography_lowest
  method: open_corridor
  elevation_mode: terrain_matched
  default_width_m: 120
cache: {mode: fresh}
plots: {raw_products: true, processed_products: true, formats: [png], dpi: 110}
simulation:
  start_time_s: 0
  # end_time_s is inferred from rainfall: 172800 seconds / 48 hours.
  output_interval_s: 3600
  output_directory: results/transient
  save_hotstart: true
