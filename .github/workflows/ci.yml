name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,notebook]"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q riftprep tools hpc tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Regenerate published notebook
        run: python tools/build_general_notebook.py

      - name: Confirm notebook is reproducible
        run: git diff --exit-code -- RIFT_Input_Builder.ipynb
