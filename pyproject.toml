[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riftprep"
version = "0.3.0"
description = "Raw-first, provenance-preserving input preparation for RIFT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "RIFT-UConn workflow contributors"}]
dependencies = [
  "geopandas>=1.0",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "netCDF4>=1.7",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "rasterio>=1.3",
  "requests>=2.31",
  "scipy>=1.11",
  "shapely>=2.0",
  "xarray>=2024.1",
  "dask[array]>=2024.1",
]

[project.optional-dependencies]
watershed-workflow = [
  "watershed-workflow>=2.1",
  "hf-hydrodata>=1.4,<2",
  "meshpy>=2026.1,<2027",
  "rosetta-soil>=0.3,<0.4",
]
notebook = ["ipywidgets>=8", "jupyterlab>=4", "nbclient>=0.10", "nbformat>=5.10"]
era5 = ["cdsapi>=0.7"]
daymet = ["earthaccess>=0.14", "pydap>=3.5.6"]
mrms = ["cfgrib>=0.9.15", "eccodes>=2.37"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
riftprep = "riftprep.cli:main"

[tool.setuptools.packages.find]
include = ["riftprep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
